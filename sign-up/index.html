<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event-Driven Programming</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
</head>

<body class="flex flex-row min-h-screen justify-center items-center bg-zinc-800 text-zinc-100">
  <main
    class="bg-zinc-100 text-zinc-800 p-4 rounded w-3/4 md:w-1/2 xl:w-1/3 flex flex-col shadow-2xl opacity-0 transition-all">
    <h1 class="text-4xl font-semibold mb-4">
      Sign Up
    </h1>

    <form id="sign-up-form">
      <div class="flex flex-row justify-between">
        <p>Email</p>
        <input id="email" type="email" class="border-none outline-none px-2 h-6 bg-zinc-300">
      </div>
      <p id="email-error" class="text-red-500 font-bold h-6 transition-all max-h-0 overflow-y-hidden"></p>

      <div class="flex flex-row justify-between mt-1">
        <p>Phone Number</p>
        <input id="phone-number" type="text" class="border-none outline-none px-2 h-6 bg-zinc-300">
      </div>
      <p id="phone-number-error" class="text-red-500 font-bold h-6 transition-all max-h-0 overflow-y-hidden"></p>

      <div class="flex flex-row justify-between mt-1">
        <p>Password</p>
        <input id="password" type="password" class="border-none outline-none px-2 h-6 bg-zinc-300">
      </div>
      <p id="password-error" class="text-red-500 font-bold h-6 transition-all max-h-0 overflow-y-hidden"></p>

      <span class="flex flex-row justify-between mt-4">
        <input type="submit"
          class="px-4 py-2 bg-green-600 text-zinc-100 rounded hover:scale-110 hover:shadow-2xl transition-all"
          value="Sign Up">
        <input id="back" type="button"
          class="px-4 py-2 bg-zinc-800 text-zinc-100 rounded hover:scale-110 hover:shadow-2xl transition-all"
          value="Back">
      </span>
    </form>
  </main>

  <div id="generic-modal" tabindex="-1" class="hidden fixed bg-[#00000080] left-0 right-0 top-0 bottom-0 z-50">
    <div class="bg-zinc-100 text-zinc-800 p-6 rounded">
      <h3 id="generic-modal__msg" class="text-lg font-semibold">Successfully submitted!</h3>
      <button id="generic-modal__close-btn"
        class="mt-4 bg-red-600 text-zinc-100 px-4 py-2 rounded hover:scale-110 hover:shadow-2xl transition-all">
        Close
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
